services:
  db:
    image: postgres:16-alpine
    container_name: control_tower_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_DB: ${POSTGRES_DB:-control_tower}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-control_tower}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend runs locally (not in Docker) to access authenticated CLI tools
  # Use ./scripts/start-backend.sh and ./scripts/stop-backend.sh
  # backend:
  #   build: ./backend
  #   ...

  frontend:
    build: ./frontend
    container_name: control_tower_frontend
    restart: always
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    # Backend runs on host, frontend needs to reach it
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - VITE_API_URL=http://host.docker.internal:8001

  redis:
    image: redis:7-alpine
    container_name: control_tower_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Port exposed for local backend access
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redis_data:
