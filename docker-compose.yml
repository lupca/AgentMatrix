services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agmx_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ct}
      POSTGRES_DB: ${POSTGRES_DB:-control_tower}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ct} -d ${POSTGRES_DB:-control_tower}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mcp:
    build: ./backend
    container_name: agmx_mcp
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8100}:8100"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ct}:${DB_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-control_tower}
      DATABASE_URL_READONLY: postgresql://${CT_READONLY_USER:-ct_readonly_user}:${CT_READONLY_PASSWORD:-readonly}@db:5432/${POSTGRES_DB:-control_tower}
      REDIS_URL: redis://redis:6379/0
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:?MCP_TOKEN_SECRET is required}
      MCP_NATIVE_URL: ${MCP_NATIVE_URL:-http://localhost:8100/mcp}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8100/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: agmx_worker
    restart: unless-stopped
    command: ["dramatiq", "app.workers.agent_runner", "app.workers.outbox_publisher"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ct}:${DB_PASSWORD:-secret}@db:5432/${POSTGRES_DB:-control_tower}
      REDIS_URL: redis://redis:6379/0
      MCP_TOKEN_SECRET: ${MCP_TOKEN_SECRET:?MCP_TOKEN_SECRET is required}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: agmx_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Port exposed for local backend access
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redis_data:
